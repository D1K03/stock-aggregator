name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo. Narrower than the repo default, deliberately.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The declared floor, not the newest available: a 3.12-only construct
          # must not pass here and then break for someone on 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: screener
          POSTGRES_DB: screener_test
        ports:
          - 5432:5432
        # Steps do not start until pg_isready succeeds, so the suite never races
        # a database that is still coming up.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://postgres:screener@localhost:5432/screener_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests
        # The suite drops and recreates the public schema per test, so it needs a
        # throwaway database — which the service container above is. `pytest` is
        # parallel by default (see pyproject) and each worker creates its own
        # database in that server, so `postgres` needs to be reachable as a
        # superuser — which it is here.
        #
        # No `-v`: with workers interleaving, a line per test is noise rather
        # than a log, and a failure prints its own name either way.
        run: pytest

  # Builds the deployment images without publishing them, so a broken Dockerfile
  # fails on the pull request rather than after merge, when the only signal is
  # a red deploy.
  #
  # Pull requests only, and that is the point: on a push to main `deploy.yml`
  # builds these same four images from the same commit and pushes them, so doing
  # it here first is the same work twice — about three minutes of it, sitting on
  # the critical path *before* the deploy that repeats it can even start. The
  # check that a Dockerfile still builds has already happened on the pull
  # request that introduced it.
  #
  # `ci-ok` keeps this in `needs` and tolerates a skip: its condition looks for
  # failure or cancellation, and a skipped job is neither.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        name: Build the status service image
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        name: Build the dashboard image
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        name: Build the transcription image
        with:
          context: .
          file: deploy/Dockerfile.transcribe
          push: false
          load: false
          cache-from: type=gha,scope=transcribe
          cache-to: type=gha,mode=max,scope=transcribe
      - uses: docker/build-push-action@v6
        name: Build the live capture image
        with:
          context: .
          file: deploy/Dockerfile.skybird
          push: false
          load: false
          cache-from: type=gha,scope=skybird
          cache-to: type=gha,mode=max,scope=skybird

  # A single stable check for branch protection to require. Requiring the matrix
  # jobs by name is brittle: change the matrix and the old name never reports
  # again, leaving PRs waiting forever on a check that will never arrive — with
  # nothing red to explain why. This name never changes.
  ci-ok:
    if: always()
    needs: [typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Deploying from here rather than from a `push` trigger in deploy.yml means
  # the commit that ships is exactly the one ci-ok went green on. A separate
  # push-triggered workflow would race this one and could win.
  deploy:
    needs: [ci-ok]
    # `always()` is load-bearing, not decoration. A skipped job propagates the
    # skip through `needs` transitively, and `build` is skipped on a push
    # because the deploy rebuilds those images anyway. Without this, ci-ok
    # succeeds, deploy is skipped with it, and a merge to main silently ships
    # nothing. The result of ci-ok is then checked explicitly, because
    # `always()` alone would deploy a failing build.
    if: >-
      always() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The workflow-level grant above stays read-only; only this job widens, and
    # only to what publishing to GHCR needs.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
