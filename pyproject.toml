[project]
name = "screener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The only network client in the project. Ingest talks to APIs, and the
    # fetch fallback chain needs proxy support, connection reuse and per-request
    # timeouts — none of which stdlib urllib gives without hand-rolling them.
    # Secrets loading is the deliberate exception and stays on urllib, because it
    # runs before anything else and must not depend on the package installing.
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    # The Discord gateway client, for the inbound bot only. Alert delivery is
    # still an httpx POST to a webhook and does not import this.
    #
    # Not a cheap dependency, and not worth describing as one: it pulls aiohttp,
    # which pulls aiohappyeyeballs, aiosignal, attrs, frozenlist, multidict,
    # propcache and yarl. Eight new packages, and a second HTTP stack beside
    # httpx. What it buys is the gateway protocol — identify, heartbeat, resume,
    # session limits, reconnect backoff, rate-limit buckets — which is the part
    # nobody should write twice.
    #
    # Upper bound, unlike the two above: this sits on discord.py's whole API
    # surface rather than on a stable request and response shape, and 3.0 is a
    # declared breaking release.
    "discord.py>=2.4,<3",
]

[project.optional-dependencies]
# Speech to text, installed by exactly one image and by nothing else. The three
# runtime dependencies above are unchanged: `screener.transcribe.client`, which
# is what the bot and the status service import to ask for a transcript, needs
# httpx and nothing more. Only the container that holds the model takes these.
#
# faster-whisper rather than openai-whisper or WhisperX, both of which need
# torch. WhisperX is this plus wav2vec2 forced alignment and pyannote
# diarization, which give word-level timestamps and speaker labels — neither of
# which means anything for one person talking into their phone, and both of
# which are what the torch dependency is for.
#
# No `apt-get install ffmpeg` anywhere: PyAV ships the FFmpeg libraries in its
# wheel, and that is what decodes Discord's Opus and Safari's AAC alike.
#
# Upper bound for the reason discord.py has one: this sits on a Python API
# rather than on a stable request and response shape.
voice = [
    "faster-whisper>=1.2,<2",
]
# Live stream capture, installed by exactly one image and by nothing else. The
# three runtime dependencies above are unchanged: `screener.skybird` is reached
# by the status service for `store` and `platforms`, neither of which imports
# this, and `capture` imports it inside a function the way `transcribe.server`
# imports faster-whisper.
#
# yt-dlp rather than our own extractors. YouTube and Twitch each want player
# response parsing, an access token dance and a repair every time either
# changes something; this is the "take the better tool for a specific job"
# clause in DESIGN.md, and it is pure Python with nothing compiled under it.
#
# No upper bound, unlike discord.py and faster-whisper. We sit on
# `extract_info` and a dict, not on a wide API surface, and being *stale* is the
# failure mode that actually bites here: a pin would hold the version that
# stopped working the week a platform changed something.
#
# ffmpeg is the other half and cannot come from a wheel: this is live HLS
# segmentation with reconnect, which is the binary's own muxer rather than a
# decode of one finished buffer. `deploy/Dockerfile.skybird` apt-installs it,
# and that image only.
stream = [
    "yt-dlp>=2026.1",
]
# Article extraction, for the magpie container only. trafilatura pulls lxml,
# courlan, htmldate and justext — mid-weight, and nowhere near the transcriber's
# class, which is why this is an extra rather than a runtime dependency: the
# status service and the bot ask magpie for a document over HTTP and never parse
# one themselves.
#
# The library also ships its own downloader. It is never imported: using it
# would bypass the proxy ladder and the daily meter at once, and the article
# would arrive looking perfectly correct. `tests/test_magpie_extract.py` is what
# holds that line.
#
# Upper bound for discord.py's reason: this sits on a Python API surface rather
# than on a stable request and response shape.
scrape = [
    "trafilatura>=2.2,<3",
]
# Finance-tuned sentiment, for the sentiment container only. FinBERT under
# onnxruntime, which brings numpy, protobuf and flatbuffers, plus the tokenizer
# it was trained with.
#
# **Lighter than `voice`, and not by accident.** `faster-whisper` already
# installs `tokenizers` and `onnxruntime` in the transcriber image -- the VAD it
# runs is an ONNX model -- so this is that image's dependency set minus
# ctranslate2 and PyAV. The argument for a separate image is therefore not the
# libraries; it is the 440 MB of weights, which belong to one service and would
# otherwise be pulled by every container on every deploy.
#
# Not `transformers`, which is the obvious way to run a BERT and would bring
# torch with it for a forward pass we have already exported. The checkpoint is
# converted to ONNX once at build time by `deploy/finbert_export.py`, in a
# builder stage that is thrown away.
#
# `tokenizers` rather than a WordPiece of our own. It is short enough to write
# and subtle enough to get quietly wrong -- accents, control characters, the CJK
# spacing rule -- and a tokenizer that disagrees with the one FinBERT was
# trained with does not fail, it returns a slightly wrong number.
#
# Upper bounds for discord.py's reason: both sit on a Python API surface rather
# than on a stable request and response shape.
sentiment = [
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]

dev = [
    # The one extra that tests install, unlike `voice` and `stream`, whose
    # libraries the tests replace with an ordinary function because what those
    # tests defend is the seam rather than the model. Here the library's
    # behaviour *is* the decision under test: that links come out of the
    # extracted article and not the raw HTML, which is the difference between
    # a page's citations and its Donate button. A suite that cannot run that
    # never checks the thing most likely to break.
    "screener[scrape]",
    "pytest>=8.0",
    # One worker per core, each with its own throwaway database. Not a nicety:
    # applying eighteen migrations costs ~320ms and every database test pays it,
    # which is two thirds of the wall clock. That work is irreducible -- the app
    # opens its own connections so there is no transaction to roll back, and
    # `create database ... template` measured *slower* -- but it parallelises.
    "pytest-xdist>=3.6",
    "pyright>=1.1.400",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default, because the serial suite is three and a half minutes and
# that is long enough to stop running it. `-n0` puts it back on one process when
# a failure needs reading in order, or a debugger needs a terminal.
addopts = "-n auto"

[tool.pyright]
include = ["src", "tests"]
# Check against the minimum supported interpreter, not whichever one the venv
# happens to hold, so a 3.12-only construct cannot slip past unnoticed.
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
