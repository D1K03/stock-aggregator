# Production stack for the VPS.
#
#   docker compose --env-file .env \
#     -f deploy/compose.prod.yaml -f deploy/compose.tunnel.yaml up -d
#
# Named `compose.prod.yaml`, never `compose.override.yaml`: Docker merges a
# file with that name automatically, so a bare `docker compose up` anywhere in
# the tree would silently pick up production configuration.
#
# Postgres runs here, on the VPS, with a named volume. The `compose.yaml` at
# the repository root is a different thing entirely: the throwaway database the
# test suite drops and recreates.
name: stock-aggregator

services:
  # Caddy, and it is called `app` on purpose.
  #
  # The Cloudflare tunnel's public hostname points at `app:8080`. That mapping
  # lives in the Zero Trust dashboard rather than in this repository, so
  # renaming this service would mean editing the tunnel by hand to match, and
  # a stale route fails as a 502 with nothing here to explain it. Keeping the
  # name means the router can be introduced without touching Cloudflare at all.
  app:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Relative to THIS file's directory, not the working directory: compose
      # resolves bind mounts against the compose file, so a `deploy/` prefix
      # here would look for deploy/deploy/caddy on the box.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The status service: sign-in, probes, migrations, provenance.
  api:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      postgres:
        # The entrypoint applies migrations before serving, so starting it
        # against a database still coming up would fail the deploy for a
        # reason that has nothing to do with the release.
        condition: service_healthy

    # No `ports:`. Caddy reaches this over the compose network, and the tunnel
    # reaches Caddy, so nothing new listens on the host and there is no port to
    # collide with the other stack on this box.
    expose:
      - "8080"

    # Secrets come from the env file only. Listing them under `environment:` as
    # well would silently win over it and blank out anything unset in the
    # shell, so infrastructure wiring lives below and credentials do not.
    env_file:
      - path: .env
        required: false

    environment:
      # Composed here rather than fetched, because the password has to be in
      # the env file anyway for the postgres service below: a second copy in
      # Infisical would be a second thing to rotate and a chance to disagree.
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      # The only other credentials stored on this server. Everything else is
      # fetched with them at startup and never touches disk.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

    healthcheck:
      # /health, not /ready: a readiness probe here would restart a perfectly
      # healthy container every time the database blipped, and restarting would
      # not fix anything.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8080/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The dashboard. Static and unwired: it renders illustrative data and reads
  # nothing from Postgres, so it needs no credentials of its own.
  web:
    image: ghcr.io/d1k03/stock-aggregator-web:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production

  # The Discord gateway. Same image as `api` with a different command rather
  # than a second Dockerfile: one dependency set, one build, and the only thing
  # that differs is which module runs. The cost is that the api image carries
  # discord.py without importing it, which is a few megabytes and is not worth
  # a second image to avoid.
  bot:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.bot"]

    # No ports and no Caddy route: the gateway dials outward, exactly as
    # cloudflared does, so nothing needs to reach it.
    #
    # No healthcheck either. discord.py reconnects on its own with backoff, and
    # a check that cannot tell "reconnecting" from "wedged" would restart a bot
    # that was about to recover.
    env_file:
      - path: .env
        required: false

    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

  # Speech to text, for voice messages in Discord and the mic button on the
  # dashboard. Its own image rather than a command override on `api` like the
  # bot above: the bot shares a dependency set with the status service and this
  # does not, and ctranslate2, onnxruntime and PyAV together are larger than
  # everything else in this repository.
  #
  # No env_file and no Infisical trio. It holds no credentials, opens no
  # database connection and calls nothing outside this network. The only thing
  # it could be told is where its weights are, and those are in the image.
  #
  # No route in the Caddyfile either. `/transcribe` matches the catch-all, which
  # goes to the dashboard, so nothing on the internet resolves here — the same
  # arrangement that keeps /api/render private. The browser reaches it through
  # the status service, which is what holds the session.
  transcribe:
    image: ghcr.io/d1k03/stock-aggregator-transcribe:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8081"

    healthcheck:
      # The weights load before the socket opens, so a container answering here
      # is one that has them. start_period covers that load.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8081/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # The first resource limit in this stack, on the first service to earn one.
    # Everything else here is idle until asked a question; this saturates a core
    # for as long as the clip is, on a box shared with four other compose
    # projects. Two cores is also what WHISPER_THREADS is set to in the image,
    # and the two have to agree: ctranslate2 otherwise spawns one thread per
    # core it can see and spends its time being descheduled inside the quota.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  postgres:
    # Same major version as the test suite and CI. A schema that leans on range
    # partitioning and GiST exclusion constraints should not first meet a
    # different Postgres in production.
    image: postgres:16
    restart: unless-stopped

    # Not published to the host. Reachable only from the compose network, which
    # means the database has no public attack surface and needs no firewall
    # rule of its own.
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener}
      POSTGRES_DB: ${POSTGRES_DB:-screener}

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screener}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Named rather than a bind mount, so `docker compose down` cannot delete the
  # database by accident and the data does not depend on a host path.
  pg_data:
  caddy_data:
  caddy_config:
