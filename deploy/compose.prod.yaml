# Production stack for the VPS.
#
#   docker compose --env-file .env \
#     -f deploy/compose.prod.yaml -f deploy/compose.tunnel.yaml up -d
#
# Named `compose.prod.yaml`, never `compose.override.yaml`: Docker merges a
# file with that name automatically, so a bare `docker compose up` anywhere in
# the tree would silently pick up production configuration.
#
# Postgres runs here, on the VPS, with a named volume. The `compose.yaml` at
# the repository root is a different thing entirely: the throwaway database the
# test suite drops and recreates.
name: stock-aggregator

services:
  # Caddy, and it is called `app` on purpose.
  #
  # The Cloudflare tunnel's public hostname points at `app:8080`. That mapping
  # lives in the Zero Trust dashboard rather than in this repository, so
  # renaming this service would mean editing the tunnel by hand to match, and
  # a stale route fails as a 502 with nothing here to explain it. Keeping the
  # name means the router can be introduced without touching Cloudflare at all.
  app:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Relative to THIS file's directory, not the working directory: compose
      # resolves bind mounts against the compose file, so a `deploy/` prefix
      # here would look for deploy/deploy/caddy on the box.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The status service: sign-in, probes, migrations, provenance.
  api:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      postgres:
        # The entrypoint applies migrations before serving, so starting it
        # against a database still coming up would fail the deploy for a
        # reason that has nothing to do with the release.
        condition: service_healthy

    # No `ports:`. Caddy reaches this over the compose network, and the tunnel
    # reaches Caddy, so nothing new listens on the host and there is no port to
    # collide with the other stack on this box.
    expose:
      - "8080"

    # Secrets come from the env file only. Listing them under `environment:` as
    # well would silently win over it and blank out anything unset in the
    # shell, so infrastructure wiring lives below and credentials do not.
    env_file:
      - path: .env
        required: false

    environment:
      # Composed here rather than fetched, because the password has to be in
      # the env file anyway for the postgres service below: a second copy in
      # Infisical would be a second thing to rotate and a chance to disagree.
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      # The only other credentials stored on this server. Everything else is
      # fetched with them at startup and never touches disk.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      # Where the scraper is. Both the status service and the bot ask it;
      # neither holds a parser or a proxy credential of its own.
      MAGPIE_URL: http://magpie:8082
      # The read-only role the playground connects as. One variable is the whole
      # switch: `:+` expands to nothing when the password is unset, and the app
      # already treats an empty variable as absent, so leaving it out means the
      # role has no password, cannot log in, and the page says it is off.
      PLAYGROUND_DB_PASSWORD: ${PLAYGROUND_DB_PASSWORD:-}
      PLAYGROUND_DATABASE_URL: ${PLAYGROUND_DB_PASSWORD:+postgresql://playground:${PLAYGROUND_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-screener}}
      # Steven's role is provisioned here too -- this container is where
      # migrations and `ensure_password` run -- but its URL is not built here.
      # This process must not hold a connection string for a role it does not
      # use, and the bot must not hold one for this role.
      PLAYGROUND_BOT_DB_PASSWORD: ${PLAYGROUND_BOT_DB_PASSWORD:-}
      # And the MCP connector's role, which this container both provisions and
      # uses -- claude.ai calls `/mcp` here, and the OAuth consent screen needs
      # the session cookie this process issues, so the two cannot be separate
      # containers. That means this one holds three read-only passwords and the
      # separation between the console and the connector is a branch in Python
      # rather than a credential; `playground/config.py` says so out loud. What
      # the third role still buys is that widening what claude.ai may read costs
      # a migration.
      PLAYGROUND_MCP_DB_PASSWORD: ${PLAYGROUND_MCP_DB_PASSWORD:-}
      PLAYGROUND_MCP_DATABASE_URL: ${PLAYGROUND_MCP_DB_PASSWORD:+postgresql://playground_mcp:${PLAYGROUND_MCP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-screener}}

    healthcheck:
      # /health, not /ready: a readiness probe here would restart a perfectly
      # healthy container every time the database blipped, and restarting would
      # not fix anything.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8080/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The dashboard. Static and unwired: it renders illustrative data and reads
  # nothing from Postgres, so it needs no credentials of its own.
  web:
    image: ghcr.io/d1k03/stock-aggregator-web:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production

  # The Discord gateway. Same image as `api` with a different command rather
  # than a second Dockerfile: one dependency set, one build, and the only thing
  # that differs is which module runs. The cost is that the api image carries
  # discord.py without importing it, which is a few megabytes and is not worth
  # a second image to avoid.
  bot:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.bot"]

    # No ports and no Caddy route: the gateway dials outward, exactly as
    # cloudflared does, so nothing needs to reach it.
    #
    # No healthcheck either. discord.py reconnects on its own with backoff, and
    # a check that cannot tell "reconnecting" from "wedged" would restart a bot
    # that was about to recover.
    env_file:
      - path: .env
        required: false

    environment:
      # The bot reads the database as much as the status service does: the
      # spend cap, Steven's memory, the audit trail every reply writes, and the
      # skybird control tools. Missing, every one of those fails in a way that
      # looks like nothing happening -- the cap fails open by design, memory
      # comes back empty, and the trail simply has no Discord in it -- which is
      # exactly how this was absent from the first deploy without anyone
      # noticing. Infisical does not carry it because it is not a secret; it is
      # the same compose-network address `api` is given four services up.
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      # Where the scraper is. Both the status service and the bot ask it;
      # neither holds a parser or a proxy credential of its own.
      MAGPIE_URL: http://magpie:8082
      # Steven's `sql` tool, as `playground_bot` -- the console's role minus the
      # skybird schema. Same variable name the api reads, a different role
      # behind it, and deliberately not `PLAYGROUND_DB_PASSWORD`: the split is
      # only real while this container cannot authenticate as the other role.
      PLAYGROUND_DATABASE_URL: ${PLAYGROUND_BOT_DB_PASSWORD:+postgresql://playground_bot:${PLAYGROUND_BOT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-screener}}
      # Emptied on purpose, and this line is load-bearing. `PLAYGROUND_DB_PASSWORD`
      # is read from `.env` to build the api's URL above, and `env_file: .env`
      # would then hand the same file's contents to this container as
      # environment -- putting the console's credential in the one process that
      # must not have it. `environment:` wins over `env_file:`, so this is where
      # that is undone. `tests/test_compose.py` fails if it goes.
      PLAYGROUND_DB_PASSWORD: ""
      PLAYGROUND_MCP_DB_PASSWORD: ""

    depends_on:
      # On `api` rather than `postgres`, for the reason `reddit` gives: a
      # healthy database is not a migrated one, and the bot reads `audit.event`
      # and skybird's tables on its first message.
      api:
        condition: service_healthy

  # Speech to text, for voice messages in Discord and the mic button on the
  # dashboard. Its own image rather than a command override on `api` like the
  # bot above: the bot shares a dependency set with the status service and this
  # does not, and ctranslate2, onnxruntime and PyAV together are larger than
  # everything else in this repository.
  #
  # No env_file and no Infisical trio. It holds no credentials, opens no
  # database connection and calls nothing outside this network. The only thing
  # it could be told is where its weights are, and those are in the image.
  #
  # No route in the Caddyfile either. `/transcribe` matches the catch-all, which
  # goes to the dashboard, so nothing on the internet resolves here — the same
  # arrangement that keeps /api/render private. The browser reaches it through
  # the status service, which is what holds the session.
  transcribe:
    image: ghcr.io/d1k03/stock-aggregator-transcribe:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8081"

    healthcheck:
      # The weights load before the socket opens, so a container answering here
      # is one that has them. start_period covers that load.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8081/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # The first resource limit in this stack, on the first service to earn one.
    # Everything else here is idle until asked a question; this saturates a core
    # for as long as the clip is, on a box shared with four other compose
    # projects. Two cores is also what WHISPER_THREADS is set to in the image,
    # and the two have to agree: ctranslate2 otherwise spawns one thread per
    # core it can see and spends its time being descheduled inside the quota.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # Finance-tuned sentiment: text in, three probabilities out.
  #
  # The `transcribe` arrangement rather than the `bot` one, and for the same
  # reason: a separate dependency set earns a separate image. What earns it here
  # is less the libraries than the weights — 440 MB of BERT that belong to one
  # service, and that every other container would pull on every deploy if this
  # shared the api image.
  #
  # No env_file and no Infisical trio. It holds no credentials, opens no
  # database connection and calls nothing outside this network. The only thing
  # it could be told is where its weights are, and those are in the image.
  #
  # No route in the Caddyfile either. `/score` matches the catch-all, which goes
  # to the dashboard, so nothing on the internet resolves here — the same
  # arrangement that keeps /transcribe and /api/render private.
  sentiment:
    image: ghcr.io/d1k03/stock-aggregator-sentiment:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8083"

    healthcheck:
      # The weights load and the column order is read before the socket opens,
      # so a container answering here is one that has both. start_period covers
      # that load.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8083/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # The third service to earn a limit, on the same argument the transcriber
    # made: everything else in this stack is idle until asked a question, and
    # this saturates its quota for as long as the batch is, on a box shared with
    # four other compose projects. Two cores is also what SENTIMENT_THREADS is
    # set to in the image, and the two have to agree — onnxruntime otherwise
    # spawns one thread per core it can see and spends its time being
    # descheduled inside the quota.
    #
    # Two gigabytes, and the first draft of this said one. Measured on the box:
    # a batch containing a 512-token text peaks at 1,097 MB resident — the graph
    # is 438 MB on disk and onnxruntime's arena allocator grows well past it and
    # does not give it back. A gigabyte would have been an OOM kill on the first
    # long Reddit comment, which `restart: unless-stopped` would have turned
    # into a loop rather than a message.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # Social ingest: posts and comments for the Sentiment pillar, backfilled once
  # and then kept up every few hours.
  #
  # The `bot` arrangement rather than the `transcribe` one: this needs httpx and
  # psycopg and nothing else, so it is the api image with a different command.
  # No second Dockerfile, no fourth CI build, no extra image to pull on deploy.
  #
  # No ports and no Caddy route, and no healthcheck for the reason the bot has
  # none: a check cannot tell "sleeping until the next pass" from "wedged", and
  # restarting a worker that was fine is worse than not noticing for six hours.
  # The scraper. Paste a link, get the article kept.
  #
  # Its own image, for one dependency and one credential: trafilatura and lxml
  # land only here, and this is the only container given the Bright Data
  # variables — so the only process in the stack whose fetches can cost money is
  # the one whose job is fetching.
  magpie:
    image: ghcr.io/d1k03/stock-aggregator-magpie:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped

    # No ports and no Caddy route. The browser asks the status service, which
    # holds the session; the status service asks this over the compose network.
    expose:
      - "8082"

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8082/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # A page is a page. This parses HTML and writes rows; it does not need much,
    # and bounding it means a pathological document cannot crowd the scorer.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

    depends_on:
      api:
        condition: service_healthy

  reddit:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.reddit"]

    depends_on:
      # On `api`, not on `postgres`, because a healthy database is not the same
      # as a migrated one. This needs `social_item` and the `data_source` row to
      # exist, and `api` is what applies migrations before it starts answering.
      # Without this the first pass fails on a missing table and waits for the
      # next tick, which is a poor first impression for something that runs
      # four times a day.
      api:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

  # Insider transactions: SEC Form 4, for the Insider/Institutional pillar.
  #
  # The `reddit` arrangement rather than the `magpie` one: httpx, psycopg and
  # the stdlib XML parser, so this is the api image with a different command.
  # No second Dockerfile and no extra image to pull on a deploy.
  #
  # **Off unless EDGAR_CONTACT_EMAIL is set**, and the address is the credential
  # and the switch at once -- SEC answers 403 to a User-Agent that names nobody,
  # so there is nothing here to turn on without one. Deliberately *not*
  # SEC_CONTACT_EMAIL, which the quarterly universe refresh reads: setting a
  # contact address for a command run four times a year should not start a
  # daily crawler against the same government service. Unset, this logs one line
  # and exits 0, which `restart: unless-stopped` answers by starting it again to
  # exit again -- a cheap loop, no socket and no connection, and the same shape
  # `nightly` has with NIGHTLY_ENABLED=false.
  #
  # No ports, no Caddy route and no healthcheck, for the reason `reddit` has
  # none: a probe cannot tell "asleep until the next pass" from "wedged", and
  # restarting a worker that was fine is worse than not noticing for twelve
  # hours.
  edgar:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.edgar"]

    depends_on:
      # On `api`, not on `postgres`, for the reason `reddit` gives: a healthy
      # database is not a migrated one. This needs `insider_transaction` and the
      # `data_source` row -- and a loaded `security` table, because the walk
      # filters EDGAR's daily index against `security.cik` and an empty universe
      # is a pass that correctly fetches nothing while looking exactly like a
      # broken one.
      api:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

  # Rupert: which security a text is about, and how that text reads.
  #
  # The `reddit` arrangement rather than `magpie`'s -- httpx, psycopg and the
  # sentiment client, which is httpx again -- so this is the api image with a
  # different command. No second Dockerfile and no extra image on a deploy.
  #
  # **Off unless `RUPERT_DAILY_MAX_CALLS` is set**, and that is the one thing
  # worth knowing about this container. It is the only service here that spends
  # money per item rather than per request from a person, so its budget starts
  # at zero and it exits 0 saying so. `restart: unless-stopped` then brings it
  # back to exit again, which means turning it on needs the container recreated
  # (`docker compose up -d rupert`) rather than merely restarted -- the same
  # shape `NIGHTLY_ENABLED` already has, and worth the symmetry.
  rupert:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.rupert"]

    depends_on:
      # On `api` for the reason `reddit` and `edgar` both give: a healthy
      # database is not a migrated one. This needs the `rupert` schema, the
      # `data_source` row, and a loaded `security` table -- an empty universe
      # means an empty lexicon, which is a pass that shortlists nothing while
      # looking exactly like a working one.
      api:
        condition: service_healthy
      # Started rather than healthy, deliberately. A mention with no reading is
      # a state this handles and can come back to, so a sentiment container
      # still loading 438 MB of weights should delay the readings rather than
      # hold up the resolutions -- which are the expensive half.
      sentiment:
        condition: service_started

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      # The default the client already uses, written down so the edge between
      # these two containers is visible in the file that wires them together
      # rather than only in a Python constant.
      SENTIMENT_URL: http://sentiment:8083/score
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

  # The nightly pipeline: prices, fundamentals, scoring, once a night.
  #
  # Its own service rather than a cron on the box, because a schedule outside
  # this repository is one more thing that fails invisibly -- `CLAUDE.md`
  # already names two of those, and a third is not worth the simplicity.
  #
  # No healthcheck, and no ports. It spends almost all of its life asleep on a
  # `threading.Event`, so there is nothing to probe that would distinguish
  # "waiting for 23:00" from "wedged", and a check that could not tell them
  # apart would restart a container that was about to do its job.
  nightly:
    image: ghcr.io/d1k03/stock-aggregator:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "screener.nightly"]

    depends_on:
      # On `api`, not on `postgres`, for the reason `reddit` gives: a healthy
      # database is not a migrated one, and this needs `security`, `metric` and
      # the seeded reference rows to exist before its first night.
      api:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      NIGHTLY_TRIGGER_HOUR: ${NIGHTLY_TRIGGER_HOUR:-23}
      NIGHTLY_ENABLED: ${NIGHTLY_ENABLED:-true}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}

  # Live stream capture. Its own image, because ffmpeg and yt-dlp belong to
  # nothing else in this stack.
  #
  # No ports, no expose and no Caddy route: this calls out to the stream, the
  # transcriber and Postgres, and nothing ever calls it. There is no HTTP
  # surface to authenticate because there is no HTTP surface. The dashboard
  # asks for a capture by writing a row, which this polls for — the database is
  # the control plane, which is also what makes a capture survive a restart.
  #
  # No healthcheck, for the reason `bot` has none: this reconnects on its own
  # through expiring manifests and network gaps, and a check that could not tell
  # "reconnecting" from "wedged" would restart a capture that was about to come
  # back.
  skybird:
    image: ghcr.io/d1k03/stock-aggregator-skybird:${SCREENER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Migrations run in the api container's entrypoint and skybird's tables
      # arrive with them. Starting first would work — the loop retries — but it
      # would open every deploy with a minute of errors that mean nothing.
      api:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      SKYBIRD_WORK_DIR: /tmp/skybird

    # Audio never reaches a disk. Chunks land here, are POSTed once and are
    # unlinked; the bound in `skybird.config` keeps at most a couple of minutes
    # of them, which is a few megabytes. 1777 because the container runs as uid
    # 10001 and does not own /tmp.
    tmpfs:
      - /tmp/skybird:mode=1777,size=64m

    # The second resource limit in this stack, and the second service to earn
    # one. ffmpeg remuxing audio is cheap, but it runs for as long as a
    # broadcast does on a box shared with four other compose projects, and a
    # stream that misbehaves should not be able to take them with it.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  postgres:
    # Same major version as the test suite and CI. A schema that leans on range
    # partitioning and GiST exclusion constraints should not first meet a
    # different Postgres in production.
    image: postgres:16
    restart: unless-stopped

    # Not published to the host. Reachable only from the compose network, which
    # means the database has no public attack surface and needs no firewall
    # rule of its own.
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener}
      POSTGRES_DB: ${POSTGRES_DB:-screener}

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screener}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Named rather than a bind mount, so `docker compose down` cannot delete the
  # database by accident and the data does not depend on a host path.
  pg_data:
  caddy_data:
  caddy_config:
